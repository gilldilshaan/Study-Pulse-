<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand">
        <div class="brand-logo">SP</div>
        <div class="brand-text">
          <h1>StudyPulse</h1>
          <p>Productivity & Finance</p>
        </div>
      </div>

      <nav class="nav">
        <a class="active" href="index.html">Dashboard</a>
        <a href="tasks.html">Tasks</a>
        <a href="focus.html">Focus</a>
        <a href="assignments.html">Assignments</a>
        <a href="finance.html">Finance</a>

        <button onclick="logout()" style="margin-left:15px;padding:6px 10px;background:#ef4444;color:white;border:none;border-radius:6px;">
          Logout
        </button>
      </nav>
    </header>

    <main>
      <section class="page-header section-header">
        <h2>📋 Dashboard</h2>
        <p>Overview of today’s tasks, focus time and finance.</p>
      </section>

      <!-- METRICS -->
      <section class="metrics-row">
        <div class="metric-card">
          <div class="metric-icon">📊</div>
          <div class="metric-content">
            <p class="metric-label">Tasks Completed</p>
            <h3 class="metric-value" id="task-metric">0 / 0</h3>
          </div>
        </div>
      </section>

      <section class="dashboard">
        <!-- TODAY TASKS -->
        <section class="card large">
          <h2>Today’s Tasks</h2>
          <div id="dashboard-tasks"></div>
        </section>

        <!-- PROGRESS -->
        <section class="card">
          <h2>Progress</h2>
          <p id="progress-text">0%</p>
        </section>
      </section>
    </main>
  </div>

<script>
// 🔒 AUTH
const token = localStorage.getItem("token");
const user = JSON.parse(localStorage.getItem("user"));

if (!token) {
  window.location.href = "login.html";
}

// 🔓 LOGOUT
function logout() {
  localStorage.removeItem("token");
  localStorage.removeItem("user");
  window.location.href = "login.html";
}

// LOAD DASHBOARD DATA
async function loadDashboard() {
  try {
    const res = await fetch(`http://localhost:5000/api/tasks/${user.id}`);
    const tasks = await res.json();

    const completed = tasks.filter(t => t.completed).length;

    // UPDATE METRIC
    document.getElementById("task-metric").innerText =
      `${completed} / ${tasks.length}`;

    // UPDATE PROGRESS
    const percent = tasks.length === 0 ? 0 : Math.round((completed / tasks.length) * 100);
    document.getElementById("progress-text").innerText = percent + "% completed";

    // SHOW TASKS
    const container = document.getElementById("dashboard-tasks");
    container.innerHTML = "";

    tasks.slice(0, 5).forEach(task => {
      const div = document.createElement("div");
      div.style.padding = "8px";
      div.style.margin = "5px 0";
      div.style.background = "#f1f5f9";
      div.style.borderRadius = "6px";

      div.innerHTML = `
        <span style="${task.completed ? 'text-decoration: line-through; opacity:0.6;' : ''}">
          ${task.title}
        </span>
      `;

      container.appendChild(div);
    });

  } catch (err) {
    console.error(err);
  }
}

// INIT
loadDashboard();

</script>

</body>
</html>
