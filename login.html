<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in</title>
  <link rel="stylesheet" href="style.css">

  <style>
    html,body{height:100%;margin:0}
    body{
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial;
      background-color:#0f172a;
      background-image:url('background.jpg.png');
      background-repeat:no-repeat;
      background-size:cover;
      background-position:center
    }

    .login-card{
      width:360px;
      padding:24px;
      border-radius:10px;
      box-shadow:0 8px 30px rgba(2,6,23,0.28);
      background:rgba(255,255,255,0.98);
      position:relative;
      z-index:2
    }

    .login-card h1{margin:0 0 8px;font-size:20px}
    .login-card p{color:#6b7280;font-size:13px;margin-top:8px}

    .login-card label{
      display:block;
      margin-top:12px;
      font-size:13px;
      color:#374151
    }

    .login-card input{
      width:100%;
      padding:10px;
      margin-top:6px;
      border:1px solid #e5e7eb;
      border-radius:8px
    }

    .login-card button{
      width:100%;
      padding:10px;
      margin-top:16px;
      border:none;
      background:#2563eb;
      color:#fff;
      border-radius:8px;
      font-weight:700;
      cursor:pointer
    }

    .login-card button:hover{
      background:#1d4ed8;
    }
  </style>
</head>

<body>

  <div class="login-card">
    <h1>Welcome back</h1>
    <p>Sign in to continue to StudyPulse</p>

    <form id="login-form">

      <label for="email">Email
        <input id="email" type="email" required>
      </label>

      <label for="password">Password
        <input id="password" type="password" required>
      </label>

      <button type="submit">Sign in</button>

    </form>
  </div>

  <script>
    const form = document.getElementById("login-form");

    async function sha256(text) {
      const enc = new TextEncoder().encode(text);
      const buf = await crypto.subtle.digest("SHA-256", enc);
      return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
    }

    function randomToken() {
      const a = new Uint8Array(24);
      crypto.getRandomValues(a);
      return [...a].map(b => b.toString(16).padStart(2, "0")).join("");
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        const res = await fetch("http://localhost:5000/api/auth/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();
        console.log("Response:", data);

        if (res.ok) {
          // Save token
          localStorage.setItem("token", data.token);

          // Save user
          const u = data.user || {};
          const normalized = { ...u, id: u.id || u._id };
          localStorage.setItem("user", JSON.stringify(normalized));

          alert("Login successful 🚀");

          // Redirect to dashboard
          window.location.href = "index.html";

        } else {
          alert(data.message || "Login failed");
        }

      } catch (error) {
        try {
          const users = JSON.parse(localStorage.getItem("sp_users") || "[]");
          const u = users.find(x => String(x.email || "").toLowerCase() === String(email).toLowerCase());
          if (!u) {
            alert("No account found. Please register first.");
            return;
          }

          const hash = await sha256(password);
          if (hash !== u.passwordHash) {
            alert("Invalid email or password.");
            return;
          }

          localStorage.setItem("token", randomToken());
          localStorage.setItem("user", JSON.stringify({ id: u.id, name: u.name, email: u.email }));
          alert("Login successful 🚀");
          window.location.href = "index.html";
        } catch (e2) {
          console.error("Error:", error);
          alert("Server error. Make sure backend is running.");
        }
      }
    });
  </script>

</body>
</html>
