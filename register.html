<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <link rel="stylesheet" href="style.css">

  <style>
    body{
      display:flex;
      align-items:center;
      justify-content:center;
      height:100vh;
      margin:0;
      background:#0f172a;
      font-family:Arial;
    }

    .card{
      background:white;
      padding:25px;
      border-radius:10px;
      width:320px;
    }

    input{
      width:100%;
      padding:10px;
      margin-top:10px;
      border:1px solid #ccc;
      border-radius:6px;
    }

    button{
      width:100%;
      padding:10px;
      margin-top:15px;
      background:#2563eb;
      color:white;
      border:none;
      border-radius:6px;
      cursor:pointer;
    }

    button:hover{
      background:#1d4ed8;
    }

    a{
      display:block;
      margin-top:10px;
      text-align:center;
    }
  </style>
</head>

<body>

  <div class="card">
    <h2>Create Account</h2>

    <form id="register-form">

      <input id="name" type="text" placeholder="Name" required>
      <input id="email" type="email" placeholder="Email" required>
      <input id="password" type="password" placeholder="Password" required>

      <button type="submit">Register</button>

    </form>

    <a href="login.html">Already have an account? Login</a>
  </div>

  <script>
    const form = document.getElementById("register-form");

    function hash(text) {
      const s = String(text ?? "");
      let h = 2166136261;
      for (let i = 0; i < s.length; i++) {
        h ^= s.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return (h >>> 0).toString(16).padStart(8, "0");
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        const res = await fetch("http://localhost:5000/api/auth/register", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ name, email, password })
        });

        const data = await res.json();
        console.log(data);

        if (res.ok) {
          alert("Registered successfully 🎉");
          window.location.href = "login.html";
        } else {
          alert(data.message || "Registration failed");
        }

      } catch (err) {
        try {
          const users = JSON.parse(localStorage.getItem("sp_users") || "[]");
          const exists = users.some(u => String(u.email || "").toLowerCase() === String(email).toLowerCase());
          if (exists) {
            alert("Email already registered. Please sign in.");
            window.location.href = "login.html";
            return;
          }

          const passwordHash = hash(password);
          const id = `u_${Date.now()}_${Math.random().toString(16).slice(2)}`;
          users.push({ id, name, email, passwordHash, createdAt: new Date().toISOString() });
          localStorage.setItem("sp_users", JSON.stringify(users));

          alert("Registered successfully 🎉");
          window.location.href = "login.html";
        } catch (e2) {
          console.error(err);
          alert("Server error");
        }
      }
    });
  </script>
<script src="theme.js"></script>
</body>
</html>
